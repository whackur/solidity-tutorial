[profile.default]
auto_detect_remappings = false
evm_version = "osaka"
ignored_error_codes = [2424]
libs = ["../dependencies"]
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=../dependencies/@openzeppelin-contracts-5.6.1/", "forge-std/=../dependencies/forge-std-1.16.1/src/"]
solc = "0.8.35"

[rpc_endpoints]
base-sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base-sepolia = { chain = 84532, key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
