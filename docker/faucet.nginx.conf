# Faucet UI server block.
#
# The only reason this file exists is caching. The page is served straight
# from the ./web bind mount, so an edit lands on disk immediately — but a
# student's browser will happily keep serving the previous index.html/app.js
# from its own cache, which makes a mid-class fix look like it never
# deployed. Everything here is small and local, so we never cache.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}
